<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lark OS 27</title>
    <link rel="icon" href="./assets/icons/icon.svg">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./lark/9-ui/theme.css">
    <!-- version 2 omni -->
    <link rel="stylesheet" href="./lark/9-ui/omni.css">
    <link rel="stylesheet" href="./platform.css">
    <style>
        #desktop-host, #platform-host {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
        }
        #platform-host {
            pointer-events: none;
            z-index: 9000;
        }
        #platform-host > * {
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="desktop-host">
        <div id="window-host" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></div>
    </div>
    <div id="platform-host"></div>
    <script>
        let basePath = window.location.pathname;
        if (!basePath.endsWith('/')) {
            if (!basePath.split('/').pop().includes('.')) {
                basePath += '/';
            } else {
                basePath = basePath.substring(0, basePath.lastIndexOf('/') + 1);
            }
        }
        window.LDE_BASE_URL = window.location.origin + basePath;
        window.LDE_SOURCE_URL = new URL('lark/', window.LDE_BASE_URL).href;
    </script>
    <script type="module" src="./lark/0-firmware/BootLoader.js"></script>
</body>
</html>
